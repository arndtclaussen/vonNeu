<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} - FlaskApp</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="flex">  <!-- Add flex to body for layout -->
    <div class="activity-bar w-24 bg-gray-800">
        <a href="/" class="block py-2 px-4 text-gray-100 hover:bg-gray-700 {% if request.path == '/' %}bg-gray-900{% endif %}">Probes</a>
        <a href="/asteroids" class="block py-2 px-4 text-gray-100 hover:bg-gray-700 {% if request.path == '/asteroids' %}bg-gray-900{% endif %}">Asteroids</a>
    </div>

    <div class="side-bar w-64 bg-gray-200 overflow-y-auto">
        {% block sidebar %}{% endblock %}
    </div>

    <main class="editor-area flex-1 p-4 bg-gray-100">
        {% block content %}{% endblock %}
    </main>

    <script>
        // JavaScript can be added here if needed
    </script>
</body>
</html>
