<!-- templates/space/asteroids.html -->
{% extends 'base.html' %}

{% block title %}Asteroids{% endblock %}

{% block sidebar %}
<ul>
    <li><a href="{{ url_for('space.asteroids') }}" class="block py-2 px-4 text-gray-800 hover:bg-gray-300 {% if request.endpoint.startswith('space.asteroids') %}bg-gray-400{% endif %}">Asteroids</a></li>
    <li><a href="{{ url_for('space.objects') }}" class="block py-2 px-4 text-gray-800 hover:bg-gray-300 {% if request.endpoint.startswith('space.objects') %}bg-gray-400{% endif %}">Objects</a></li>
</ul>
{% endblock %}

{% block content %}
<h1>Space Asteroids</h1>

<div id="asteroids-table" class="mt-4">
    <table class="table-auto w-full">
        <thead>
            <tr>
                <th class="px-4 py-2">Name</th>
                <th class="px-4 py-2">Composition</th>
                <th class="px-4 py-2">Size</th>
                <th class="px-4 py-2">Discovered At</th>
                <th class="px-4 py-2">X-Coordinate</th>
                <th class="px-4 py-2">Y-Coordinate</th>
            </tr>
        </thead>
        <tbody id="asteroids-table-body">
            <!-- Asteroid data will be inserted here -->
        </tbody>
    </table>
</div>


<script>
    function updateAsteroidTable() {
        fetch('/space/get_asteroids') // New route to fetch asteroid data
            .then(response => response.json())
            .then(asteroids => {
                const tableBody = document.getElementById('asteroids-table-body');
                tableBody.innerHTML = ''; // Clear existing rows

                asteroids.forEach(asteroid => {
                    const row = tableBody.insertRow();
                    row.insertCell().textContent = asteroid.name;
                    row.insertCell().textContent = asteroid.composition;
                    row.insertCell().textContent = asteroid.size;
                    row.insertCell().textContent = asteroid.discovered_at;
                    row.insertCell().textContent = asteroid.x_coordinate.toFixed(2); // Format coordinates
                    row.insertCell().textContent = asteroid.y_coordinate.toFixed(2);
                });
            })
            .catch(error => console.error('Error fetching asteroids:', error));
    }

    updateAsteroidTable();
    setInterval(updateAsteroidTable, 5000); // Update every 5 seconds
</script>
{% endblock %}
