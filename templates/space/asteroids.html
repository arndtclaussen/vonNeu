<!-- templates/space/asteroids.html -->
{% extends 'base.html' %}

{% block title %}Asteroids{% endblock %}

{% block sidebar %}
    {% include 'space/_sidebar.html' %}
{% endblock %}

{% block content %}
<h1>Space Asteroids</h1>

<div class="overflow-x-auto max-w-screen-xl mt-4">
    <table class="table-auto w-full">
        <thead>
            <tr class="bg-gray-200 text-gray-800 font-semibold">
                <th class="px-4 py-2 border-b border-gray-300">Name</th>
                <th class="px-4 py-2 border-b border-gray-300">Composition</th>
                <th class="px-4 py-2 border-b border-gray-300">Size</th>
                <th class="px-4 py-2 border-b border-gray-300">Discovered At</th>
                <th class="px-4 py-2 border-b border-gray-300">X-Coordinate</th>
                <th class="px-4 py-2 border-b border-gray-300">Y-Coordinate</th>
                <th class="px-4 py-2 border-b border-gray-300">X-delta_v_x</th>
                <th class="px-4 py-2 border-b border-gray-300">Y-delta_v_y</th>
            </tr>
        </thead>
        <tbody id="asteroids-table-body" class="text-gray-700">
            <!-- Asteroid data will be inserted here -->
        </tbody>
    </table>
</div>


<script>
    function updateAsteroidTable() {
        fetch('/space/get_asteroids')
            .then(response => response.json())
            .then(asteroids => {
                const tableBody = document.getElementById('asteroids-table-body');
                tableBody.innerHTML = ''; // Clear existing rows

                asteroids.forEach((asteroid, index) => {
                    const row = tableBody.insertRow();
                    row.classList.add(
                        index % 2 === 0 ? 'bg-white' : 'bg-gray-50', 
                        'hover:bg-gray-100',
                        'border-b', 
                        'border-gray-200'
                    );

                    // Name
                    const nameCell = row.insertCell();
                    nameCell.textContent = asteroid.name;
                    nameCell.classList.add('px-4', 'py-2');

                    // Composition
                    const compCell = row.insertCell();
                    compCell.textContent = asteroid.composition;
                    compCell.classList.add('px-4', 'py-2');

                    // Size
                    const sizeCell = row.insertCell();
                    sizeCell.textContent = asteroid.size;
                    sizeCell.classList.add('px-4', 'py-2', 'text-right');

                    // Discovered At
                    const discoveredCell = row.insertCell();
                    discoveredCell.textContent = asteroid.discovered_at || 'N/A'; // Handle null
                    discoveredCell.classList.add('px-4', 'py-2');

                    // X-coordinate
                    const xCoordCell = row.insertCell();
                    xCoordCell.textContent = asteroid.x_coordinate.toFixed(2);
                    xCoordCell.classList.add('px-4', 'py-2', 'text-right');

                    // Y-coordinate
                    const yCoordCell = row.insertCell();
                    yCoordCell.textContent = asteroid.y_coordinate.toFixed(2);
                    yCoordCell.classList.add('px-4', 'py-2', 'text-right');
                    
                    // delta-X-V
                    const deltaxvCell = row.insertCell();
                    deltaxvCell.textContent = asteroid.delta_v_x.toFixed(2);
                    deltaxvCell.classList.add('px-4', 'py-2', 'text-right');

                    // delta-X-V
                    const deltayvCell = row.insertCell();
                    deltayvCell.textContent = asteroid.delta_v_y.toFixed(2);
                    deltayvCell.classList.add('px-4', 'py-2', 'text-right');
                });
            })
            .catch(error => console.error('Error fetching asteroids:', error));
    }

    updateAsteroidTable();
    setInterval(updateAsteroidTable, 1000); 
</script>
{% endblock %}
